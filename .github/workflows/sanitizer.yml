name: Sanitizer

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  sanitizer:
    name: ${{matrix.sanitizer}} (${{matrix.os}})
    runs-on: ${{matrix.os}}
    strategy:
      matrix:
        os: [ubuntu-latest]
        sanitizer: [address, undefined]
      fail-fast: false

    steps:
    - uses: actions/checkout@v4

    - name: Configure CMake
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=Debug \
          -DSTD_HTTP_BUILD_TESTS=ON \
          -DSTD_HTTP_BUILD_EXAMPLES=ON \
          -DCMAKE_C_FLAGS="-fsanitize=${{matrix.sanitizer}} -fno-omit-frame-pointer" \
          -DCMAKE_CXX_FLAGS="-fsanitize=${{matrix.sanitizer}} -fno-omit-frame-pointer" \
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=${{matrix.sanitizer}}"
      env:
        CC: clang
        CXX: clang++

    - name: Build
      run: cmake --build build

    - name: Test
      working-directory: build
      env:
        ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
        UBSAN_OPTIONS: print_stacktrace=1:abort_on_error=1
      run: ctest --output-on-failure

  sanitizer-windows:
    name: address (windows)
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Configure CMake
      run: cmake -B build -DSTD_HTTP_BUILD_TESTS=ON -DSTD_HTTP_BUILD_EXAMPLES=ON

    - name: Build
      run: cmake --build build --config Debug

    - name: Test
      working-directory: build
      run: ctest -C Debug --output-on-failure
